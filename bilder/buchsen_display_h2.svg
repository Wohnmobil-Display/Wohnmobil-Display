<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img"><title>Buchsen an Display und H2-Board</title><desc>Display-Rückseite: Schalter oben auf UART1 (nach rechts), rechts Buchse USB (Kabel zum H2) und darunter UART1 (Computer, nur Erstinstallation), links POWER (5 V). ESP32-H2-Board: unten links Buchse UART (Kabel zum Display), unten rechts Buchse USB (Computer, nur Erstinstallation), Jumper J5 muss stecken.</desc>
