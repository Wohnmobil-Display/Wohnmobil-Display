<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img"><title>Systemübersicht Wohnmobil-Display</title><desc>12-V-Bordnetz über DC/DC-Wandler 5 V an das Display (POWER J9). Display per USB an die Steuerplatine mit ESP32-H2 (Buchse UART). Steuerplatine an Frischwasser, Abwasser, Pumpe und EBL. Summer an GPIO-Klemme J8, Näherungssensor an I2C H1. Funkverbindungen WLAN, Bluetooth, Zigbee.</desc>
<style>.t{font:14px sans-serif;fill:#2C2C2A}.ts{font:12px sans-serif;fill:#5F5E5A}.th{font:500 14px sans-serif;fill:#2C2C2A}.g rect{fill:#F1EFE8;stroke:#888780}.p rect{fill:#EEEDFE;stroke:#534AB7}.p text{fill:#3C3489}.k rect{fill:#E1F5EE;stroke:#0F6E56}.k text{fill:#085041}.c rect{fill:#FAECE7;stroke:#993C1D}.c text{fill:#712B13}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="470" fill="#FFFFFF"/>
<g class="c"><rect x="20" y="30" width="170" height="50" rx="8"/><text class="th" x="105" y="52" text-anchor="middle">12-V-Bordnetz</text><text class="ts" x="105" y="70" text-anchor="middle">mit Sicherung</text></g>
<g class="c"><rect x="20" y="120" width="170" height="50" rx="8"/><text class="th" x="105" y="142" text-anchor="middle">DC/DC 12 V → 5 V</text><text class="ts" x="105" y="160" text-anchor="middle">mind. 2 A</text></g>
<path d="M105 80 V116" fill="none" stroke="#993C1D" stroke-width="1.5" marker-end="url(#a)"/>
<g class="p"><rect x="260" y="100" width="220" height="150" rx="10"/><text class="th" x="370" y="160" text-anchor="middle">Display</text><text class="ts" x="370" y="180" text-anchor="middle">ESP32-S3-Touch-LCD-7B</text><text class="ts" x="370" y="198" text-anchor="middle">7" Touch, WLAN, Bluetooth</text></g>
<path d="M190 145 H256" fill="none" stroke="#993C1D" stroke-width="1.5" marker-end="url(#a)"/>
<text class="ts" x="210" y="138">5 V</text>
<g class="k"><rect x="570" y="120" width="170" height="90" rx="8"/><text class="th" x="655" y="150" text-anchor="middle">Steuerplatine</text><text class="ts" x="655" y="170" text-anchor="middle">mit ESP32-H2 (notwendig)</text><text class="ts" x="655" y="188" text-anchor="middle">Zigbee, Tanks, Pumpe, EBL</text></g>
<path d="M480 165 H566" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#a)"/>
<text class="ts" x="486" y="158">„USB“ → „UART“</text>


<g class="k"><rect x="560" y="280" width="180" height="56" rx="8"/><text class="th" x="650" y="303" text-anchor="middle">Frischwasser</text><text class="ts" x="650" y="322" text-anchor="middle">Ultraschall oder Originalgeber (V2)</text></g>
<g class="k"><rect x="560" y="376" width="180" height="56" rx="8"/><text class="th" x="650" y="399" text-anchor="middle">Abwasser</text><text class="ts" x="650" y="418" text-anchor="middle">Elektrodenstäbe</text></g>
<path d="M655 210 V276" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#a)"/>
<text class="ts" x="662" y="248">Pins 5V G 11 12</text>
<path d="M570 190 H530 V404 H556" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#a)"/>
<text class="ts" x="424" y="398">Pins 10, 1–4</text>
<g class="g"><rect x="260" y="296" width="110" height="56" rx="8"/><text class="th" x="315" y="319" text-anchor="middle">Summer</text><text class="ts" x="315" y="338" text-anchor="middle">GPIO J8: GP6</text></g>
<path d="M315 250 V292" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<g class="g"><rect x="386" y="296" width="134" height="56" rx="8"/><text class="th" x="453" y="319" text-anchor="middle">Näherungssensor</text><text class="ts" x="453" y="338" text-anchor="middle">I2C H1: VL53L0X</text></g>
<path d="M453 250 V292" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>


<g class="g"><rect x="20" y="210" width="210" height="240" rx="8"/>
<text class="th" x="36" y="236">Funk</text>
<text class="t" x="36" y="262">WLAN</text><text class="ts" x="36" y="280">Router oder Handy-Hotspot</text>
<text class="t" x="36" y="306">Bluetooth (Display)</text><text class="ts" x="36" y="324">Victron MPPT-Laderegler</text><text class="ts" x="36" y="342">Mopeka Pro (2 Gasflaschen)</text><text class="ts" x="36" y="360">JK-BMS Aufbau-Batterie</text>
<text class="t" x="36" y="386">Zigbee (über Steuerplatine)</text><text class="ts" x="36" y="404">Tür/Fenster, Bewegung, Wasser</text><text class="ts" x="36" y="422">Rauch/Gas, Temperatur</text></g>
<path d="M230 225 H256" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
</svg>
