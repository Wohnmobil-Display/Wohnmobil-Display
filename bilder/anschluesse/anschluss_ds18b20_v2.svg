<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" role="img"><title>Fest verbaute Temperaturfühler DS18B20 an der Steuerplatine V2</title><desc>Bis zu vier DS18B20 parallel an einer gemeinsamen Leitung: 3,3 Volt, Daten und Masse. Anschluss an die Klemmen J10 oder J14 der Steuerplatine.</desc>
<style>.t{font:15px sans-serif;fill:#2C2C2A}.ts{font:13px sans-serif;fill:#5F5E5A}.th{font:600 15px sans-serif;fill:#2C2C2A}.w{fill:none;stroke-width:3}.n{fill:#FFFFFF;stroke:#444441;stroke-width:1.5}</style>
<rect width="820" height="520" fill="#FFFFFF"/>
<text class="th" x="16" y="28" font-size="18">Festverdrahtete Temperaturfühler (DS18B20) anschließen</text>
<!-- Sammelleitungen -->
<path class="w" d="M20 150 H548" stroke="#D85A30"/><path class="w" d="M20 190 H548" stroke="#C99700"/><path class="w" d="M20 230 H548" stroke="#444441"/>
<text class="ts" x="20" y="140" fill="#D85A30">+3,3 V</text><text class="ts" x="20" y="180">Daten (1-Wire)</text><text class="ts" x="20" y="220">Masse (GND)</text>
<rect x="40" y="300" width="150" height="70" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text class="th" x="115" y="332" text-anchor="middle">Fühler 1</text><text class="ts" x="115" y="352" text-anchor="middle">z. B. außen</text><path class="w" d="M70 300 V230" stroke="#444441"/><circle cx="70" cy="230" r="5" fill="#444441"/><path class="w" d="M115 300 V190" stroke="#C99700"/><circle cx="115" cy="190" r="5" fill="#C99700"/><path class="w" d="M160 300 V150" stroke="#D85A30"/><circle cx="160" cy="150" r="5" fill="#D85A30"/><rect x="230" y="300" width="150" height="70" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text class="th" x="305" y="332" text-anchor="middle">Fühler 2</text><text class="ts" x="305" y="352" text-anchor="middle">z. B. Kühlschrank</text><path class="w" d="M260 300 V230" stroke="#444441"/><circle cx="260" cy="230" r="5" fill="#444441"/><path class="w" d="M305 300 V190" stroke="#C99700"/><circle cx="305" cy="190" r="5" fill="#C99700"/><path class="w" d="M350 300 V150" stroke="#D85A30"/><circle cx="350" cy="150" r="5" fill="#D85A30"/><rect x="420" y="300" width="150" height="70" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/><text class="th" x="495" y="332" text-anchor="middle">Fühler 3 / 4</text><text class="ts" x="495" y="352" text-anchor="middle">optional</text><path class="w" d="M450 300 V230" stroke="#444441"/><circle cx="450" cy="230" r="5" fill="#444441"/><path class="w" d="M495 300 V190" stroke="#C99700"/><circle cx="495" cy="190" r="5" fill="#C99700"/><path class="w" d="M540 300 V150" stroke="#D85A30"/><circle cx="540" cy="150" r="5" fill="#D85A30"/>
<text class="ts" x="40" y="392">Je Fühler 3 Adern. Gleiche Funktion = gleiche Sammelleitung (parallel).</text>
<!-- Platine -->
<rect x="548" y="60" width="256" height="310" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text class="th" x="676" y="84" text-anchor="middle">Steuerplatine V2</text>
<text class="th" x="566" y="118">Klemme J10 „DS18B20“</text>
<circle class="n" cx="590" cy="150" r="12"/><text class="t" x="590" y="155" text-anchor="middle">1</text><text class="t" x="614" y="155">+3V3</text>
<circle class="n" cx="590" cy="190" r="12"/><text class="t" x="590" y="195" text-anchor="middle">2</text><text class="t" x="614" y="195">Daten</text>
<circle class="n" cx="590" cy="230" r="12"/><text class="t" x="590" y="235" text-anchor="middle">3</text><text class="t" x="614" y="235">GND</text>
<text class="th" x="566" y="280">Klemme J14 „DS18B20 2“</text>
<text class="ts" x="566" y="300">linker Platinenrand, gleiche Belegung.</text>
<text class="ts" x="566" y="320">J10 und J14 sind parallel geschaltet:</text>
<text class="ts" x="566" y="336">die Fühler an J10, J14 oder beide.</text>
<text class="th" x="16" y="424">Wichtig</text>
<text class="t" x="16" y="448">• Bis zu <tspan font-weight="600">4 Fühler</tspan> werden ausgewertet, jeder DS18B20 hat eine eigene Seriennummer.</text>
<text class="t" x="16" y="470">• Der 4,7-kΩ-Pull-up sitzt schon auf der Platine – keinen zusätzlichen anbauen.</text>
<text class="t" x="16" y="492">• Im Display: Temperatur-Kachel (Innen / Außen / Kühlschrank) → Sensor „Fest verbaut 1, 2 …“ wählen.</text>
<text class="ts" x="16" y="512">Adernfarben je nach Fühler verschieden – maßgeblich ist die Beschriftung am Fühler (VDD = +3,3 V, DQ = Daten, GND).</text>
</svg>