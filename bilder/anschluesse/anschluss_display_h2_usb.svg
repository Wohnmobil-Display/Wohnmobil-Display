<svg xmlns="http://www.w3.org/2000/svg" width="760" height="604" viewBox="0 0 760 604" role="img"><title>Display und Steuerplatine verbinden</title><desc>Oben: Erstinstallation am Computer – Display über Buchse UART1 (SW1 auf UART1), ESP32-H2-Board über Buchse USB mit gestecktem Jumper J5. Unten: Betrieb im Wohnmobil – 12 V vom EBL an die Steuerplatine, Klemme 5V Display mit zwei Adern an Display POWER J9, USB-C-Kabel von H2-Buchse UART zur Display-Buchse USB.</desc>
<style>.t{font:14px sans-serif;fill:#2C2C2A}.ts{font:12px sans-serif;fill:#5F5E5A}.th{font:500 14px sans-serif;fill:#2C2C2A}.hd{font:600 16px sans-serif;fill:#2C2C2A}.g rect{fill:#F1EFE8;stroke:#888780}.p rect{fill:#EEEDFE;stroke:#534AB7}.p text{fill:#3C3489}.k rect{fill:#E1F5EE;stroke:#0F6E56}.k text{fill:#085041}.c rect{fill:#FAECE7;stroke:#993C1D}.c text{fill:#712B13}.w rect{fill:#FFF8E6;stroke:#C9A227}.w text{fill:#7A5C00}</style>
<defs><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="604" fill="#FFFFFF"/>

<!-- 1: Erstinstallation -->
<text class="hd" x="20" y="32">① Erstinstallation am Computer (einmal, vor dem Einbau)</text>
<g class="g"><rect x="20" y="90" width="140" height="90" rx="8"/><text class="th" x="90" y="124" text-anchor="middle">Computer</text><text class="ts" x="90" y="144" text-anchor="middle">Chrome oder Edge</text><text class="ts" x="90" y="162" text-anchor="middle">Installer-Seite</text></g>

<g class="p"><rect x="270" y="52" width="220" height="74" rx="8"/><text class="th" x="380" y="76" text-anchor="middle">Display</text><text class="ts" x="380" y="96" text-anchor="middle">USB-C-Buchse „UART1“</text><text class="ts" x="380" y="114" text-anchor="middle">Schalter SW1 auf „UART1“</text></g>
<g class="k"><rect x="270" y="146" width="220" height="74" rx="8"/><text class="th" x="380" y="170" text-anchor="middle">ESP32-H2-Board</text><text class="ts" x="380" y="190" text-anchor="middle">USB-C-Buchse „USB“</text><text class="ts" x="380" y="208" text-anchor="middle">(nicht „UART“)</text></g>

<path d="M160 118 H210 V89 H266" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#ap)"/>
<path d="M160 152 H210 V183 H266" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ak)"/>
<text class="ts" x="168" y="110">USB-C</text>

<text class="ts" x="510" y="84">Knopf</text><text class="th" x="510" y="102">„Display installieren“</text>
<text class="ts" x="510" y="178">Knopf</text><text class="th" x="510" y="196">„Steuerplatine installieren“</text>

<g class="w"><rect x="20" y="234" width="720" height="36" rx="6"/><text class="t" x="34" y="257">Jumper <tspan font-weight="600">J5</tspan> auf dem H2-Board muss gesteckt sein – sonst hat der Chip keinen Strom.</text></g>

<line x1="20" y1="296" x2="740" y2="296" stroke="#D3D1C7" stroke-dasharray="4 4"/>

<!-- 2: Betrieb -->
<text class="hd" x="20" y="328">② Im Wohnmobil – so bleibt es angeschlossen</text>

<g class="c"><rect x="20" y="380" width="140" height="70" rx="8"/><text class="th" x="90" y="408" text-anchor="middle">EBL, Stecker ST1</text><text class="ts" x="90" y="428" text-anchor="middle">12 V Dauerplus</text></g>

<g class="k"><rect x="230" y="350" width="250" height="160" rx="10"/><text class="th" x="355" y="372" text-anchor="middle">Steuerplatine</text><text class="ts" x="355" y="390" text-anchor="middle">12 V → 5 V (3 A)</text></g>
<g class="k"><rect x="260" y="402" width="190" height="56" rx="6" style="fill:#FFFFFF"/><text class="th" x="355" y="424" text-anchor="middle">ESP32-H2 aufgesteckt</text><text class="ts" x="355" y="443" text-anchor="middle">Buchse „UART“ →</text></g>
<text class="ts" x="355" y="494" text-anchor="middle" style="fill:#712B13">Klemme „5V Display“ →</text>

<g class="p"><rect x="580" y="350" width="160" height="160" rx="10"/><text class="th" x="660" y="378" text-anchor="middle">Display</text><text class="ts" x="660" y="424" text-anchor="middle">Buchse „USB“</text><text class="ts" x="660" y="494" text-anchor="middle">POWER J9 (5V, GND)</text></g>

<path d="M160 415 H226" fill="none" stroke="#993C1D" stroke-width="1.5" marker-end="url(#ac)"/>
<text class="ts" x="176" y="407">12 V</text>

<path d="M450 430 H576" fill="none" stroke="#534AB7" stroke-width="2.5" marker-start="url(#ap)" marker-end="url(#ap)"/>
<text class="ts" x="486" y="422">USB-C-Kabel</text>
<text class="ts" x="486" y="448">Daten + Updates</text>

<path d="M480 490 H576" fill="none" stroke="#993C1D" stroke-width="2.5" marker-end="url(#ac)"/>
<text class="ts" x="486" y="482">5 V + GND</text>

<text class="t" x="20" y="546">Im Betrieb bleiben „UART1“ am Display und „USB“ am H2 frei.</text>
<text class="t" x="20" y="568">Updates für Display und Steuerplatine holt das Display selbst über WLAN –</text>
<text class="t" x="20" y="588">die Steuerplatine wird dabei über das USB-C-Kabel aktualisiert, nichts ausbauen.</text>
</svg>
